<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>楊梅高中圖書館｜3D 實境新生利用教育解謎系統</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b1120;
            font-family: 'Noto Sans TC', sans-serif;
            color: #f8fafc;
        }
        #canvas-container {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        .glass-panel {
            background: rgba(15, 23, 42, 0.86);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(56, 189, 248, 0.28);
            box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.6), inset 0 1px 0 0 rgba(255, 255, 255, 0.1);
        }
        .glass-modal {
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(56, 189, 248, 0.45);
            box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.85), 0 0 30px rgba(14, 165, 233, 0.2);
        }
        .cyber-btn {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }
        .cyber-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px -3px rgba(14, 165, 233, 0.45);
        }
        .cyber-btn:active:not(:disabled) {
            transform: translateY(0);
        }
        .mono-font {
            font-family: 'JetBrains Mono', monospace;
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.6);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(56, 189, 248, 0.4);
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(56, 189, 248, 0.7);
        }
        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 12px rgba(239, 68, 68, 0.7); }
            50% { box-shadow: 0 0 28px rgba(239, 68, 68, 1); }
        }
        .alarm-flash {
            animation: pulseGlow 0.6s infinite;
        }
        .zone-tag {
            pointer-events: none;
            transition: opacity 0.2s ease, transform 0.2s ease;
        }
    </style>
</head>
<body class="relative select-none">

    <!-- 3D Scene Canvas Container -->
    <div id="canvas-container"></div>

    <!-- 3D Floating HTML Labels Layer -->
    <div id="labels-container" class="absolute inset-0 pointer-events-none overflow-hidden z-10"></div>

    <!-- RFID Alarm Overlay -->
    <div id="rfid-alarm-banner" class="hidden fixed top-20 left-1/2 -translate-x-1/2 z-50 glass-panel border-2 border-red-500 bg-red-950/90 text-white px-6 py-4 rounded-2xl alarm-flash max-w-xl w-[92%] pointer-events-auto">
        <div class="flex items-start gap-4">
            <div class="w-12 h-12 rounded-xl bg-red-600 flex items-center justify-center shrink-0 text-2xl animate-bounce">
                <i class="fa-solid fa-triangle-exclamation"></i>
            </div>
            <div class="flex-1">
                <div class="flex items-center justify-between">
                    <h4 class="font-black text-red-300 text-base tracking-wide">【圖書 RFID 安全門警報 & 館規攔截】</h4>
                    <button onclick="closeAlarmBanner()" class="text-red-300 hover:text-white text-sm px-2 py-0.5 rounded bg-red-900/60">關閉</button>
                </div>

            </div>
        </div>
    </div>

    <!-- Top HUD Bar -->
    <header class="fixed top-0 left-0 right-0 z-20 p-2 sm:p-3 pointer-events-none flex flex-wrap items-center justify-between gap-2">
        <!-- Left: Brand & Virtual Clock & Player Compliance Status -->
        <div class="glass-panel rounded-2xl px-3.5 py-2 pointer-events-auto flex items-center gap-3 sm:gap-4">

    <!-- Bottom HUD: Movement Controls + Interactive Proximity Prompt + Inventory Bar -->

                    <button onmousedown="startMove('turnRight')" onmouseup="stopMove()" ontouchstart="startMove('turnRight'); event.preventDefault();" ontouchend="stopMove()" class="w-8 h-8 sm:w-9 sm:h-9 rounded-lg bg-slate-800/90 hover:bg-sky-600/40 border border-slate-600 flex items-center justify-center text-slate-200 text-xs" title="右轉 (E)">

    <!-- Toast Notification -->
    <div id="toast-container" class="fixed bottom-28 right-4 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <script>
        /*************************************************************************
         * 1. SOUND SYNTHESIZER (Web Audio API - No external audio files needed)
         *************************************************************************/
        const SoundFX = {
            ctx: null,
            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (AudioCtx) this.ctx = new AudioCtx();
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            },
            playTone(freq, type = 'sine', duration = 0.15, vol = 0.12) {
                try {
                    this.init();
                    if (!this.ctx) return;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    gain.gain.setValueAtTime(vol, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + duration);
                } catch (e) {}
            },
            click() { this.playTone(660, 'sine', 0.08, 0.1); },
            success() {
                this.playTone(523.25, 'triangle', 0.12, 0.15);
                setTimeout(() => this.playTone(659.25, 'triangle', 0.12, 0.15), 100);
                setTimeout(() => this.playTone(783.99, 'triangle', 0.25, 0.18), 200);
            },
            alarm() {
                this.playTone(320, 'sawtooth', 0.22, 0.2);
                setTimeout(() => this.playTone(220, 'sawtooth', 0.28, 0.2), 200);
            },
            cardBeep() {
                this.playTone(1250, 'sine', 0.12, 0.16);
            }
        };

        /*************************************************************************
         * 2. ARCHITECTURAL FLOOR PLAN DATA (Exact 1:1 Coordinate Mapping to PNGs)
         * Coordinate space: X in [-12, 12] (Width 24m), Z in [-7, 7] (Depth 14m)
         *************************************************************************/
        const ZONES_1F = [
            {
                id: 'gate_1f', floor: 1, name: '大門 & RFID 安全門', category: 'gate',
                x: -0.4, z: 6.3, w: 2.6, d: 0.7, h: 2.2, color: 0x0ea5e9,
                desc: '圖書館一樓出入口，設有圖書 RFID 安全系統與監控系統。攜帶違禁私人物品或未借閱書籍通過將觸發警報！'
            },
            {
                id: 'lockers_1f', floor: 1, name: '置物櫃', category: 'interactive',
                x: -11.0, z: 5.0, w: 1.5, d: 3.2, h: 1.9, color: 0x38bdf8,
                desc: '入館必經站！不可攜帶飲食（含礦泉水）、書包等私人物品入館，館內亦不得使用手機。'
            },
            {
                id: 'desk_left_low_1f', floor: 1, name: '閱讀桌 (左下)', category: 'furniture',
                x: -11.0, z: 1.5, w: 1.5, d: 3.0, h: 0.85, color: 0x64748b,
                desc: '靠窗個人閱讀桌，可攜帶自己的書籍入館閱讀，但嚴禁攜帶書包與飲料。'
            },
            {
                id: 'newspaper_1f', floor: 1, name: '報架 (當日報紙)', category: 'interactive',
                x: -11.3, z: -0.5, w: 0.9, d: 1.3, h: 1.4, color: 0xf59e0b,
                desc: '一樓陳列當日報紙，圖書館至少保存最近二週內之報紙以供查閱使用。'
            },
            {
                id: 'desk_left_high_1f', floor: 1, name: '閱讀桌 (左上)', category: 'furniture',
                x: -11.0, z: -2.8, w: 1.5, d: 3.0, h: 0.85, color: 0x64748b,
                desc: '一樓左側閱讀桌區。'
            },
            {
                id: 'tablet_cart_1f', floor: 1, name: '平板車', category: 'furniture',
                x: -9.5, z: -4.1, w: 1.1, d: 0.9, h: 1.1, color: 0x6366f1,
                desc: '行動載具充電與管理平板車（教師授課所需才可使用數位設備）。'
            },

        function initThreeJS() {
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x080d1a);
            scene.fog = new THREE.FogExp2(0x080d1a, 0.022);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);

            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xdbeafe, 0.7);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.85);
            dirLight.position.set(12, 24, 15);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 1024;
            dirLight.shadow.mapSize.height = 1024;
            scene.add(dirLight);

            const pointLight1 = new THREE.PointLight(0x38bdf8, 0.6, 25);
            pointLight1.position.set(-5, 5, 0);
            scene.add(pointLight1);

            const pointLight2 = new THREE.PointLight(0x818cf8, 0.6, 25);
            pointLight2.position.set(6, 5, 0);
            scene.add(pointLight2);

            // Build Floor Groups
            floor1Group = new THREE.Group();
            floor2Group = new THREE.Group();
            scene.add(floor1Group);
            scene.add(floor2Group);

            buildLibraryFloor(floor1Group, ZONES_1F, 1);
            buildLibraryFloor(floor2Group, ZONES_2F, 2);
            floor2Group.visible = false;

            // Build Player Avatar (Visible in Orbital mode & reflections)
            const playerGroup = new THREE.Group();
            const bodyGeo = new THREE.CylinderGeometry(0.28, 0.28, 1.2, 16);
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0x10b981, emissive: 0x059669, emissiveIntensity: 0.4 });
            const bodyMesh = new THREE.Mesh(bodyGeo, bodyMat);
            bodyMesh.position.y = 0.6;
            playerGroup.add(bodyMesh);

            const headGeo = new THREE.SphereGeometry(0.24, 16, 16);
            const headMat = new THREE.MeshStandardMaterial({ color: 0xfde047 });
            const headMesh = new THREE.Mesh(headGeo, headMat);
            headMesh.position.y = 1.42;
            playerGroup.add(headMesh);

            // Direction Cone
            const coneGeo = new THREE.ConeGeometry(0.18, 0.45, 12);
            const coneMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8 });
            const coneMesh = new THREE.Mesh(coneGeo, coneMat);
            coneMesh.rotation.x = -Math.PI / 2;
            coneMesh.position.set(0, 1.0, -0.38);
            playerGroup.add(coneMesh);

            playerMesh = playerGroup;
            scene.add(playerMesh);

            // Target Destination Ring
            const ringGeo = new THREE.RingGeometry(0.25, 0.4, 24);
            const ringMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8, side: THREE.DoubleSide, transparent: true, opacity: 0.8 });
            targetMarkerMesh = new THREE.Mesh(ringGeo, ringMat);
            targetMarkerMesh.rotation.x = -Math.PI / 2;
            targetMarkerMesh.position.y = 0.04;
            targetMarkerMesh.visible = false;
            scene.add(targetMarkerMesh);

            setupInputHandlers();
            rebuildHTMLZoneLabels();

            const floorMat = new THREE.MeshStandardMaterial({
                color: floorNum === 1 ? 0x0f172a : 0x111827,
                roughness: 0.6,
                metalness: 0.1
            });
            const floorMesh = new THREE.Mesh(floorGeo, floorMat);
            floorMesh.rotation.x = -Math.PI / 2;
            floorMesh.receiveShadow = true;
            floorMesh.userData = { isFloor: true, floor: floorNum };
            group.add(floorMesh);

            // Architectural Grid Helper
            const grid = new THREE.GridHelper(24, 24, 0x1e293b, 0x1e293b);
            grid.position.y = 0.01;
            grid.scale.z = 14 / 24;
            group.add(grid);

            // Outer Perimeter Low Glass Walls (Width 24, Depth 14)
            const wallMat = new THREE.MeshStandardMaterial({
                color: 0x38bdf8,
                transparent: true,
                opacity: 0.14,
                roughness: 0.2
            });
            const northWall = new THREE.Mesh(new THREE.BoxGeometry(24, 2.8, 0.15), wallMat);
            northWall.position.set(0, 1.4, -7);
            group.add(northWall);

            const southWall = new THREE.Mesh(new THREE.BoxGeometry(24, 2.8, 0.15), wallMat);
            southWall.position.set(0, 1.4, 7);
            group.add(southWall);

            const westWall = new THREE.Mesh(new THREE.BoxGeometry(0.15, 2.8, 14), wallMat);
            westWall.position.set(-12, 1.4, 0);
            group.add(westWall);

            const eastWall = new THREE.Mesh(new THREE.BoxGeometry(0.15, 2.8, 14), wallMat);
            eastWall.position.set(12, 1.4, 0);
            group.add(eastWall);

            // Build Each Zone 3D Representation
            zones.forEach(zone => {
                const zoneGroup = new THREE.Group();
                zoneGroup.position.set(zone.x, 0, zone.z);

                // Base Glowing Pad on Floor
                const padGeo = new THREE.PlaneGeometry(zone.w, zone.d);
                const padMat = new THREE.MeshBasicMaterial({
                    color: zone.color,
                    transparent: true,
                    opacity: zone.category === 'furniture' ? 0.18 : 0.35,
                    side: THREE.DoubleSide
                });
                const padMesh = new THREE.Mesh(padGeo, padMat);
                padMesh.rotation.x = -Math.PI / 2;
                padMesh.position.y = 0.02;
                zoneGroup.add(padMesh);

                // Detailed 3D Sub-structures matching the blueprint
                if (zone.id === 'gate_1f') {
                    // Two RFID Security Pillars
                    const pillarGeo = new THREE.BoxGeometry(0.18, 1.7, 0.55);
                    const pillarMat = new THREE.MeshStandardMaterial({ color: 0x0ea5e9, emissive: 0x0284c7, emissiveIntensity: 0.5 });
                    [-0.9, 0, 0.9].forEach(offsetX => {
                        const pillar = new THREE.Mesh(pillarGeo, pillarMat);
                        pillar.position.set(offsetX, 0.85, 0);
                        zoneGroup.add(pillar);
                    });
                } else if (zone.id === 'stacks_2f') {
                    // 10 Vertical Rows of Bookshelves on 2F (matching 2F blueprint)
                    const shelfW = 1.1;
                    const shelfD = 4.2;
                    const shelfH = 2.0;
                    const startX = -8.6;
                    const gapX = 1.91;
                    for (let i = 0; i < 10; i++) {
                        const sGeo = new THREE.BoxGeometry(shelfW, shelfH, shelfD);
                        const sMat = new THREE.MeshStandardMaterial({
                            color: i === 3 ? 0x0284c7 : 0x1e3a8a,
                            roughness: 0.5
                        });
                        const sMesh = new THREE.Mesh(sGeo, sMat);
                        sMesh.position.set(startX + i * gapX, shelfH / 2, 0);
                        sMesh.castShadow = true;
                        zoneGroup.add(sMesh);
                    }
                } else if (zone.id === 'reading_center_2f') {
                    // 2 columns x 3 rows of long reading blocks on 2F
                    for (let col = 0; col < 2; col++) {
                        for (let row = 0; row < 3; row++) {
                            const bGeo = new THREE.BoxGeometry(6.8, 0.78, 1.25);
                            const bMat = new THREE.MeshStandardMaterial({ color: 0x334155 });
                            const bMesh = new THREE.Mesh(bGeo, bMat);
                            bMesh.position.set(col === 0 ? -4.1 : 4.1, 0.39, -1.7 + row * 1.7);
                            zoneGroup.add(bMesh);
                        }
                    }
                } else if (zone.id === 'reading_right_1f') {
                    // 2x3 Grid of Square Reading Tables on 1F top-right
                    for (let c = 0; c < 2; c++) {
                        for (let r = 0; r < 3; r++) {
                            const tGeo = new THREE.BoxGeometry(1.6, 0.78, 1.15);
                            const tMat = new THREE.MeshStandardMaterial({ color: 0x3b82f6 });
                            const tMesh = new THREE.Mesh(tGeo, tMat);
                            tMesh.position.set(c === 0 ? -1.1 : 1.1, 0.39, -1.45 + r * 1.45);
                            zoneGroup.add(tMesh);
                        }
                    }
                } else if (zone.id === 'book_display_1f') {
                    // 3 horizontal rows of 曬書桌
                    for (let r = 0; r < 3; r++) {
                        const dGeo = new THREE.BoxGeometry(zone.w - 0.2, 0.82, 0.52);
                        const dMat = new THREE.MeshStandardMaterial({ color: 0x0369a1 });
                        const dMesh = new THREE.Mesh(dGeo, dMat);
                        dMesh.position.set(0, 0.41, -0.75 + r * 0.75);
                        zoneGroup.add(dMesh);
                    }
                } else if (zone.id === 'info_pc_1f') {
                    // 6 Computer Stations
                    const deskMesh = new THREE.Mesh(
                        new THREE.BoxGeometry(zone.w, 0.75, zone.d),
                        new THREE.MeshStandardMaterial({ color: 0x1e293b })
                    );
                    deskMesh.position.y = 0.375;
                    zoneGroup.add(deskMesh);
                    for (let i = 0; i < 6; i++) {
                        const monMesh = new THREE.Mesh(
                            new THREE.BoxGeometry(0.75, 0.48, 0.08),
                            new THREE.MeshStandardMaterial({ color: 0x06b6d4, emissive: 0x0891b2, emissiveIntensity: 0.6 })
                        );
                        monMesh.position.set(-3.1 + i * 1.24, 1.02, 0);
                        zoneGroup.add(monMesh);
                    }
                } else {
                    // Standard 3D Block with Wireframe Highlight
                    const boxGeo = new THREE.BoxGeometry(zone.w * 0.92, zone.h, zone.d * 0.92);
                    const isRoom = zone.h > 2.0;
                    const boxMat = new THREE.MeshStandardMaterial({
                        color: zone.color,
                        transparent: true,
                        opacity: isRoom ? 0.35 : 0.75,
                        roughness: 0.4,
                        metalness: 0.2
                    });
                    const boxMesh = new THREE.Mesh(boxGeo, boxMat);
                    boxMesh.position.y = zone.h / 2;
                    boxMesh.castShadow = true;
                    zoneGroup.add(boxMesh);

                    // Top Rim Outline
                    const edges = new THREE.EdgesGeometry(boxGeo);
                    const lineMat = new THREE.LineBasicMaterial({ color: 0x7dd3fc, transparent: true, opacity: 0.5 });
                    const line = new THREE.LineSegments(edges, lineMat);
                    line.position.y = zone.h / 2;
                    zoneGroup.add(line);
                }

                // Invisible Hitbox for Raycasting
                const hitGeo = new THREE.BoxGeometry(zone.w, Math.max(zone.h, 1.5), zone.d);
                const hitMat = new THREE.MeshBasicMaterial({ visible: false });
                const hitMesh = new THREE.Mesh(hitGeo, hitMat);
                hitMesh.position.y = Math.max(zone.h, 1.5) / 2;
                hitMesh.userData = { zoneData: zone };
                zoneGroup.add(hitMesh);
                interactiveMeshes.push(hitMesh);

                group.add(zoneGroup);
            });
        }

        /*************************************************************************
         * 5. HTML FLOATING LABELS & BLUEPRINT MINIMAP RENDERER
         *************************************************************************/
        function rebuildHTMLZoneLabels() {
            const container = document.getElementById('labels-container');
            container.innerHTML = '';
            zoneLabelElements = [];

            const zones = GameState.currentFloor === 1 ? ZONES_1F : ZONES_2F;
            const activeMission = MISSIONS.find(m => !m.isDone());

            zones.forEach(z => {
                const isInteractive = z.category !== 'furniture';
                const isTarget = activeMission && activeMission.zoneId === z.id && activeMission.floor === GameState.currentFloor;

                const el = document.createElement('div');
                el.className = `zone-tag absolute -translate-x-1/2 -translate-y-1/2 px-2 py-0.5 rounded-lg text-[10px] sm:text-xs font-bold whitespace-nowrap flex items-center gap-1 shadow-md ${
                    isTarget
                        ? 'bg-amber-500 text-slate-950 border-2 border-white animate-bounce z-20'
                        : isInteractive
                        ? 'bg-slate-900/90 text-sky-300 border border-sky-400/50'
                        : 'bg-slate-900/65 text-slate-400 border border-slate-700/50'
                }`;
                el.innerHTML = `${isTarget ? '<i class="fa-solid fa-star"></i>' : ''}${z.name}`;
                container.appendChild(el);
                zoneLabelElements.push({ zone: z, element: el });
            });
        }

        function updateHTMLZoneLabels() {
            const width = window.innerWidth;
            const height = window.innerHeight;
            const widthHalf = width / 2;
            const heightHalf = height / 2;

            zoneLabelElements.forEach(item => {
                const pos = new THREE.Vector3(item.zone.x, item.zone.h + 0.45, item.zone.z);
                pos.project(camera);

                // Check if in front of camera
                if (pos.z < 1) {
                    const x = (pos.x * widthHalf) + widthHalf;
                    const y = -(pos.y * heightHalf) + heightHalf;
                    item.element.style.transform = `translate(-50%, -50%) translate(${x}px, ${y}px)`;
                    item.element.style.opacity = '1';
                } else {
                    item.element.style.opacity = '0';
                }
            });
        }

        function renderMinimapBlueprint() {
            const wrapper = document.getElementById('minimap-svg-wrapper');
            const titleEl = document.getElementById('minimap-title');
            const zones = GameState.currentFloor === 1 ? ZONES_1F : ZONES_2F;
            const activeMission = MISSIONS.find(m => !m.isDone());

            titleEl.textContent = `圖書館 ${GameState.currentFloor}F 平面配置圖 (點擊導航)`;

            // SVG ViewBox: X from -12 to 12 (24 width), Z from -7 to 7 (14 height)
            let svgContent = `<svg viewBox="-12 -7 24 14" class="w-full h-full" id="blueprint-svg">`;
            svgContent += `<rect x="-11.9" y="-6.9" width="23.8" height="13.8" fill="#0f172a" stroke="#38bdf8" stroke-width="0.12"/>`;

            zones.forEach(z => {
                const rx = z.x - z.w / 2;
                const ry = z.z - z.d / 2;
                const isTarget = activeMission && activeMission.zoneId === z.id && activeMission.floor === GameState.currentFloor;
                const fillHex = isTarget ? '#f59e0b' : (z.category === 'furniture' ? '#1e293b' : '#0284c7');
                const strokeHex = isTarget ? '#fef08a' : '#38bdf8';

                svgContent += `
                    <g onclick="handleMinimapClick(${z.x}, ${z.z}, '${z.id}')" class="cursor-pointer hover:opacity-90">
                        <rect x="${rx}" y="${ry}" width="${z.w}" height="${z.d}" rx="0.18"
                              fill="${fillHex}" fill-opacity="${isTarget ? '0.65' : '0.42'}"
                              stroke="${strokeHex}" stroke-width="${isTarget ? '0.16' : '0.07'}"/>
                        <text x="${z.x}" y="${z.z + 0.15}" font-size="0.52" fill="#f8fafc" text-anchor="middle" font-weight="bold" pointer-events="none">
                            ${z.name.split(' ')[0]}
                        </text>
                    </g>
                `;
            });

            // Player Dot & View Cone on Minimap
            const px = GameState.player.x;
            const pz = GameState.player.z;
            svgContent += `
                <circle id="minimap-player-dot" cx="${px}" cy="${pz}" r="0.45" fill="#10b981" stroke="#ffffff" stroke-width="0.12"/>
            `;
            svgContent += `</svg>`;
            wrapper.innerHTML = svgContent;
        }

        function updateMinimapPlayerPosition() {
            const dot = document.getElementById('minimap-player-dot');
            if (dot) {
                dot.setAttribute('cx', GameState.player.x.toFixed(2));
                dot.setAttribute('cy', GameState.player.z.toFixed(2));
            }
            const coordsEl = document.getElementById('player-coords');
            if (coordsEl) {
                coordsEl.textContent = `${GameState.currentFloor}F | X:${GameState.player.x.toFixed(1)} Z:${GameState.player.z.toFixed(1)}`;
            }
        }

        function handleMinimapClick(x, z, zoneId) {
            SoundFX.click();
            // Set walk target slightly outside the center if it's a solid block, or walk directly to it
            GameState.player.targetX = x;
            GameState.player.targetZ = z;
            targetMarkerMesh.position.set(x, 0.05, z);
            targetMarkerMesh.visible = true;
        }

        /*************************************************************************
         * 6. INPUT HANDLERS, MOVEMENT & PROXIMITY DETECTION
         *************************************************************************/
        function setupInputHandlers() {
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            window.addEventListener('keydown', (e) => {
                if (!document.getElementById('modal-backdrop').classList.contains('hidden')) {
                    if (e.key === 'Escape') closeModal();
                    return;
                }
                const k = e.key.toLowerCase();
                if (k === 'w' || e.key === 'ArrowUp') moveKeys.forward = true;
                if (k === 's' || e.key === 'ArrowDown') moveKeys.backward = true;
                if (k === 'a') moveKeys.left = true;
                if (k === 'd') moveKeys.right = true;
                if (k === 'q' || e.key === 'ArrowLeft') moveKeys.turnLeft = true;
                if (e.key === 'ArrowRight') moveKeys.turnRight = true;
                if (k === 'e' && activeProximityZone) {
                    triggerActiveZoneInteraction();
                }
            });

            window.addEventListener('keyup', (e) => {
                const k = e.key.toLowerCase();
                if (k === 'w' || e.key === 'ArrowUp') moveKeys.forward = false;
                if (k === 's' || e.key === 'ArrowDown') moveKeys.backward = false;
                if (k === 'a') moveKeys.left = false;
                if (k === 'd') moveKeys.right = false;
                if (k === 'q' || e.key === 'ArrowLeft') moveKeys.turnLeft = false;
                if (e.key === 'ArrowRight') moveKeys.turnRight = false;
            });

            const domElem = renderer.domElement;
            let pointerDownPos = { x: 0, y: 0 };

            domElem.addEventListener('pointerdown', (e) => {
                isDraggingCamera = true;
                prevPointer = { x: e.clientX, y: e.clientY };
                pointerDownPos = { x: e.clientX, y: e.clientY };
            });

            window.addEventListener('pointermove', (e) => {
                if (!isDraggingCamera) return;
                const dx = e.clientX - prevPointer.x;
                const dy = e.clientY - prevPointer.y;
                prevPointer = { x: e.clientX, y: e.clientY };

                if (GameState.cameraMode === 'firstPerson') {
                    GameState.player.yaw -= dx * 0.005;
                    GameState.player.pitch = Math.max(-0.6, Math.min(0.5, GameState.player.pitch - dy * 0.004));
                } else {
                    orbitalAngle.theta -= dx * 0.006;
                    orbitalAngle.phi = Math.max(0.3, Math.min(1.35, orbitalAngle.phi - dy * 0.005));
                }
            });

            window.addEventListener('pointerup', (e) => {
                if (!isDraggingCamera) return;
                isDraggingCamera = false;
                const distMoved = Math.hypot(e.clientX - pointerDownPos.x, e.clientY - pointerDownPos.y);
                if (distMoved < 6) {
                    handleCanvasClick(e);
                }
            });
        }

        function handleCanvasClick(e) {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);

            // Check interactive 3D zones on current floor
            const currentGroup = GameState.currentFloor === 1 ? floor1Group : floor2Group;
            const intersects = raycaster.intersectObjects(currentGroup.children, true);

            for (const hit of intersects) {
                if (hit.object.userData && hit.object.userData.zoneData) {
                    const z = hit.object.userData.zoneData;
                    SoundFX.click();
                    // Walk to zone and if already close, open modal immediately
                    const dist = Math.hypot(GameState.player.x - z.x, GameState.player.z - z.z);
                    if (dist < Math.max(z.w, z.d) * 0.75 + 2.2) {
                        openZoneModal(z);
                    } else {
                        GameState.player.targetX = z.x;
                        GameState.player.targetZ = z.z;
                        targetMarkerMesh.position.set(z.x, 0.05, z.z);
                        targetMarkerMesh.visible = true;
                        showToast(`正在前往【${z.name}】...`, 'info');
                    }
                    return;
                }
                if (hit.object.userData && hit.object.userData.isFloor) {
                    GameState.player.targetX = hit.point.x;
                    GameState.player.targetZ = hit.point.z;
                    targetMarkerMesh.position.set(hit.point.x, 0.05, hit.point.z);
                    targetMarkerMesh.visible = true;
                    return;
                }
            }
        }

        function startMove(dir) {
            GameState.player.targetX = null;
            GameState.player.targetZ = null;
            targetMarkerMesh.visible = false;
            moveKeys[dir] = true;
        }

        function stopMove() {
            Object.keys(moveKeys).forEach(k => moveKeys[k] = false);
        }

        function toggleCameraMode() {
            SoundFX.click();
            GameState.cameraMode = GameState.cameraMode === 'firstPerson' ? 'orbital' : 'firstPerson';
            document.getElementById('camera-mode-label').textContent =
                GameState.cameraMode === 'firstPerson' ? '第一人稱實境' : '3D 戰術俯視';
        }

        function trySwitchFloor(targetFloor) {
            if (GameState.currentFloor === targetFloor) return;
            SoundFX.click();

            // Rule check: Must store bag, water, and silence phone before going deep into library or 2F
            if (targetFloor === 2 && (!GameState.bagStored || !GameState.waterStored || !GameState.phoneSilenced)) {
                triggerRFIDAlarm('【樓梯口攔截】不可攜帶飲食（含礦泉水）、書包入館，且館內不得使用手機！請先至 1F 左下角「置物櫃」完成淨身收納，再前往 2F 書庫。');
                return;
            }
            if (targetFloor === 2 && !GameState.entryRegistered) {
                triggerRFIDAlarm('【上課/午休特例管制】同學於上課時間或午休特例進入圖書館，須先持「學生證」與「導師簽署洽公證明」至 1F 借還書櫃台完成登記！');
                return;
            }

            GameState.currentFloor = targetFloor;
            floor1Group.visible = targetFloor === 1;
            floor2Group.visible = targetFloor === 2;

            // Place player near stairs of that floor
            if (targetFloor === 2) {
                GameState.player.x = 8.8;
                GameState.player.z = 3.8;
                GameState.player.yaw = Math.PI / 2;
            } else {
                GameState.player.x = 8.8;
                GameState.player.z = 5.5;
                GameState.player.yaw = Math.PI / 2;
            }
            GameState.player.targetX = null;
            GameState.player.targetZ = null;
            targetMarkerMesh.visible = false;

            // Update Floor Badges
            document.getElementById('current-floor-badge').textContent = `${targetFloor}F 空間`;
            document.getElementById('btn-floor-1').className = targetFloor === 1
                ? 'px-2.5 py-1 rounded-lg text-xs font-bold transition-all bg-sky-500 text-slate-950'
                : 'px-2.5 py-1 rounded-lg text-xs font-bold transition-all text-slate-400 hover:text-white';
            document.getElementById('btn-floor-2').className = targetFloor === 2
                ? 'px-2.5 py-1 rounded-lg text-xs font-bold transition-all bg-sky-500 text-slate-950'
                : 'px-2.5 py-1 rounded-lg text-xs font-bold transition-all text-slate-400 hover:text-white';

            rebuildHTMLZoneLabels();
            renderMinimapBlueprint();
            showToast(`已透過樓梯切換至【圖書館 ${targetFloor}F】`, 'success');
        }

        function triggerRFIDAlarm(message) {
            SoundFX.alarm();
            GameState.violationsCount++;
            const banner = document.getElementById('rfid-alarm-banner');
            document.getElementById('rfid-alarm-text').textContent = message;
            banner.classList.remove('hidden');
            updateHUD();
        }

        function closeAlarmBanner() {
            document.getElementById('rfid-alarm-banner').classList.add('hidden');
        }

        /*************************************************************************
         * 7. ANIMATION LOOP & PROXIMITY CHECKS
         *************************************************************************/
        function animateLoop() {
            requestAnimationFrame(animateLoop);

            const speed = 0.11;
            const turnSpeed = 0.038;

            if (moveKeys.turnLeft) GameState.player.yaw += turnSpeed;
            if (moveKeys.turnRight) GameState.player.yaw -= turnSpeed;

            let dx = 0, dz = 0;
            if (moveKeys.forward) {
                dx -= Math.sin(GameState.player.yaw) * speed;
                dz -= Math.cos(GameState.player.yaw) * speed;
            }
            if (moveKeys.backward) {
                dx += Math.sin(GameState.player.yaw) * speed;
                dz += Math.cos(GameState.player.yaw) * speed;
            }
            if (moveKeys.left) {
                dx -= Math.cos(GameState.player.yaw) * speed;
                dz += Math.sin(GameState.player.yaw) * speed;
            }
            if (moveKeys.right) {
                dx += Math.cos(GameState.player.yaw) * speed;
                dz -= Math.sin(GameState.player.yaw) * speed;
            }

            if (dx !== 0 || dz !== 0) {
                GameState.player.targetX = null;
                GameState.player.targetZ = null;
                targetMarkerMesh.visible = false;
                GameState.player.x = Math.max(-11.4, Math.min(11.4, GameState.player.x + dx));
                GameState.player.z = Math.max(-6.4, Math.min(6.4, GameState.player.z + dz));
            } else if (GameState.player.targetX !== null && GameState.player.targetZ !== null) {
                const tx = GameState.player.targetX - GameState.player.x;
                const tz = GameState.player.targetZ - GameState.player.z;
                const dist = Math.hypot(tx, tz);
                if (dist > 0.25) {
                    GameState.player.x += (tx / dist) * (speed * 1.15);
                    GameState.player.z += (tz / dist) * (speed * 1.15);
                    GameState.player.yaw = Math.atan2(-tx, -tz);
                } else {
                    GameState.player.targetX = null;
                    GameState.player.targetZ = null;
                    targetMarkerMesh.visible = false;
                }
            }

            // Update Player 3D Avatar
            playerMesh.position.set(GameState.player.x, 0, GameState.player.z);
            playerMesh.rotation.y = GameState.player.yaw;
            playerMesh.visible = GameState.cameraMode === 'orbital';

            // Update Camera Position
            if (GameState.cameraMode === 'firstPerson') {
                camera.position.set(GameState.player.x, 1.65, GameState.player.z);
                const lookX = GameState.player.x - Math.sin(GameState.player.yaw) * Math.cos(GameState.player.pitch) * 5;
                const lookY = 1.65 + Math.sin(GameState.player.pitch) * 5;
                const lookZ = GameState.player.z - Math.cos(GameState.player.yaw) * Math.cos(GameState.player.pitch) * 5;
                camera.lookAt(lookX, lookY, lookZ);
            } else {
                const camX = GameState.player.x * 0.4 + Math.sin(orbitalAngle.theta) * Math.cos(orbitalAngle.phi) * orbitalAngle.distance;
                const camY = Math.sin(orbitalAngle.phi) * orbitalAngle.distance;
                const camZ = GameState.player.z * 0.4 + Math.cos(orbitalAngle.theta) * Math.cos(orbitalAngle.phi) * orbitalAngle.distance;
                camera.position.set(camX, camY, camZ);
                camera.lookAt(GameState.player.x * 0.4, 0, GameState.player.z * 0.4);
            }

            checkProximityZones();
            updateHTMLZoneLabels();
            updateMinimapPlayerPosition();

            renderer.render(scene, camera);
        }

        function checkProximityZones() {
            const zones = GameState.currentFloor === 1 ? ZONES_1F : ZONES_2F;
            let closest = null;
            let minDist = Infinity;

            zones.forEach(z => {
                // Distance to bounding box of zone
                const dx = Math.max(Math.abs(GameState.player.x - z.x) - z.w / 2, 0);
                const dz = Math.max(Math.abs(GameState.player.z - z.z) - z.d / 2, 0);
                const dist = Math.hypot(dx, dz);
                if (dist < 1.35 && dist < minDist) {
                    minDist = dist;
                    closest = z;
                }
            });

        function openZoneModal(zone) {
            GameState.actionsCount++;
            if (zone.id === 'stairs_to_2f') {
                trySwitchFloor(2);
                return;
            }
            if (zone.id === 'stairs_to_1f') {
                trySwitchFloor(1);
                return;
            }

            const backdrop = document.getElementById('modal-backdrop');
            const title = document.getElementById('modal-title');
            const subtitle = document.getElementById('modal-subtitle');
            const body = document.getElementById('modal-body');
            const statusMsg = document.getElementById('modal-status-msg');

            title.textContent = zone.name;
            subtitle.textContent = `${zone.floor}F 空間區域｜${zone.desc}`;
            statusMsg.textContent = '請依據《115學年新生利用教育說明資料》執行複合式互動操作';

            backdrop.classList.remove('hidden');

            switch (zone.id) {
                case 'lockers_1f':
                    renderLockersModal(body);
                    break;
                case 'circulation_1f':
                    renderCirculationDeskModal(body);
                    break;
                case 'info_pc_1f':
                    renderInfoPCModal(body);
                    break;
                case 'special_col_1f':
                    renderSpecialCollectionModal(body);
                    break;
                case 'newspaper_1f':
                case 'magazine_1f':
                    renderPeriodicalsModal(body, zone.id);
                    break;
                case 'display_screen_1f':
                    renderDisplayScreenModal(body);
                    break;
                case 'stacks_2f':
                    render2FStacksModal(body);
                    break;
                case 'copier_1f':
                    renderCopierMachineModal(body);
                    break;
                case 'gate_1f':
                    renderRFIDGateModal(body);
                    break;

                    renderGeneralZoneModal(body, zone);

            }

                            <li><b>一樓：</b>辦公區、讀者服務櫃台、期刊區、資訊檢索區、梅高特藏區、討論室和閱讀區。</li>
                            <li><b>二樓：</b>書庫（10排書架）和閱讀區。</li>
                            <li><b>啟明樓：</b>一樓為「喜閱學堂」、四樓為「紅土藝術空間」。</li>
                            <li><b>開放時間：</b>08:00~16:00。第8堂為館務處理時間，未上輔導課的同學可以入館自習。打掃時間不得入館使用（例外者需獲導師同意）。</li>
                        </ul>
                    </div>
                    <div class="p-4 rounded-2xl bg-slate-900 border border-slate-700 space-y-2">
                        <h4 class="font-black text-amber-300 text-sm">二、圖書借還及續借規則</h4>
                        <ul class="list-disc pl-4 space-y-1 text-slate-300">
                            <li><b>借書動線：</b>由1F進入 ➔ 至2F書庫找書/取書 ➔ 至1F櫃台於 16:00 前完成借書程序。</li>
                            <li><b>額度與期限：</b>請攜學生證，每人最多可借 <b>4 本</b>，借期 <b>2 週</b>。</li>
                            <li><b>續借：</b>於到期日前 1~2 日到圖書館或圖書查詢系統辦理，續借期為 2 週。</li>
                            <li><b>逾期：</b>累計每本書逾期天數為暫停借閱權限天數。</li>
                        </ul>
                    </div>
                    <div class="p-4 rounded-2xl bg-slate-900 border border-slate-700 space-y-2">
                        <h4 class="font-black text-emerald-300 text-sm">三、館內設施與特藏注意事項</h4>
                        <ul class="list-disc pl-4 space-y-1 text-slate-300">
                            <li>館內不得使用手機（教師授課所需除外）。</li>
                            <li><b>1F 當月期刊</b>及 <b>2F 漫畫</b>僅限館內閱讀不外借；<b>過期雜誌</b>移置 2F 書庫供外借。</li>
                            <li><b>1F 報紙：</b>陳列當日報紙，至少保存最近二週內之報紙供查閱。</li>
                            <li><b>事務機器：</b>自備悠遊卡（餘額10元以上），黑白影印/列印每頁2元、彩色每頁6元；掃描只需過卡無需付費。</li>
                            <li><b>梅高特藏區：</b>陳列梅岡風、最近幾屆畢業紀念冊、梅高青年，不開放外借。</li>
                            <li><b>影音光碟：</b>公播版限教職員借用；學生可借家用版，不得公播使用。</li>
                        </ul>
                    </div>
                    <div class="p-4 rounded-2xl bg-slate-900 border border-slate-700 space-y-2">
                        <h4 class="font-black text-rose-300 text-sm">四、入館規定與申請借用 (Q05~Q11)</h4>
                        <ul class="list-disc pl-4 space-y-1 text-slate-300">
                            <li>不可攜帶飲食（含礦泉水）、書包等私人物品入館（可帶自己的書入館閱讀）。</li>
                            <li>上課或午休特例入館：須持<b>學生證</b>登記並獲<b>導師/任課老師簽署同意證明</b>。</li>
                            <li>全館不外借製作海報、製作畢業紀念冊等非閱讀活動。全區設有監控與圖書 RFID 安全系統。</li>
                        </ul>
                    </div>
                </div>
            `;
        }

        /*************************************************************************
         * 9. HUD, INVENTORY & MISSION UI UPDATER
         *************************************************************************/
        function updateHUD() {
            // 1. Compliance Status Pills
            const pillsEl = document.getElementById('compliance-pills');
            const clean = GameState.bagStored && GameState.waterStored && GameState.phoneSilenced;
            pillsEl.innerHTML = `
                <span class="px-2 py-0.5 rounded-lg border ${clean ? 'bg-emerald-500/20 border-emerald-500/40 text-emerald-300' : 'bg-rose-500/20 border-rose-500/40 text-rose-300'}">
                    ${clean ? '✔ 已淨身收納' : '⚠️ 攜帶違禁品中'}
                </span>
                <span class="px-2 py-0.5 rounded-lg border ${GameState.entryRegistered ? 'bg-emerald-500/20 border-emerald-500/40 text-emerald-300' : 'bg-amber-500/20 border-amber-500/40 text-amber-300'}">
                    ${GameState.entryRegistered ? '✔ 已洽公登記' : '⏳ 未櫃台登記'}
                </span>
                <span class="px-2 py-0.5 rounded-lg bg-indigo-500/20 border border-indigo-400/40 text-indigo-200 mono-font">
                    悠遊卡: $${GameState.easyCardBalance}
                </span>
            `;

            // 2. Mission List & Progress Bar
            const listEl = document.getElementById('mission-list-container');
            let completedCount = 0;
            let currentActiveMission = null;

            listEl.innerHTML = MISSIONS.map((m) => {
                const done = m.isDone();
                if (done) completedCount++;
                else if (!currentActiveMission) currentActiveMission = m;

                const isCurrent = currentActiveMission && currentActiveMission.id === m.id;
                return `
                    <div onclick="focusMissionTarget('${m.zoneId}', ${m.floor})" class="p-2 rounded-xl border cursor-pointer transition-all flex items-center justify-between gap-2 ${
                        done
                            ? 'bg-emerald-950/30 border-emerald-500/40 text-emerald-300'
                            : isCurrent
                            ? 'bg-sky-950/60 border-sky-400 text-white shadow-md shadow-sky-500/10'
                            : 'bg-slate-900/50 border-slate-800 text-slate-400'
                    }">
                        <div class="flex items-center gap-2">
                            <i class="fa-solid ${done ? 'fa-circle-check text-emerald-400' : (isCurrent ? 'fa-spinner fa-spin text-sky-400' : 'fa-circle text-slate-600')}"></i>
                            <span class="font-bold leading-tight">${m.title}</span>
                        </div>
                        <span class="text-[10px] px-1.5 py-0.5 rounded bg-slate-800 text-sky-300 shrink-0">${m.floor}F</span>
                    </div>
                `;
            }).join('');

            const pct = Math.max(8, Math.round((completedCount / MISSIONS.length) * 100));
            document.getElementById('mission-progress-bar').style.width = `${pct}%`;

            const hintEl = document.getElementById('current-hint-text');
            if (currentActiveMission) {
                hintEl.textContent = currentActiveMission.getHint();
            } else {
                hintEl.textContent = '🎉 恭喜完成所有新生利用教育實境任務！';
            }

            // 3. Inventory Bar
            const invBar = document.getElementById('inventory-bar');
            document.getElementById('inventory-count-badge').textContent = `2F借閱籃: ${GameState.borrowBasket.length}/4 件`;

            invBar.innerHTML = GameState.inventory.map(item => `
                <button onclick="inspectInventoryItem('${item.id}')" class="cyber-btn px-2.5 py-1.5 rounded-xl bg-slate-900/90 hover:bg-slate-800 border border-slate-700 flex items-center gap-2 shrink-0 text-left">
                    <i class="fa-solid ${item.icon} ${item.color} text-sm"></i>
                    <div>
                        <div class="text-[11px] font-bold text-white leading-none">${item.name}</div>
                        <div class="text-[9px] text-slate-400 mt-0.5">${item.status}</div>
                    </div>
                </button>
            `).join('');
        }

        function inspectInventoryItem(itemId) {
            SoundFX.click();
            const item = GameState.inventory.find(i => i.id === itemId);
            if (!item) return;

            if (itemId === 'smartphone' && !GameState.phoneSilenced) {
                GameState.phoneSilenced = true;
                item.status = '已關機收納';
                item.color = 'text-emerald-400';
                showToast('已直接將「智慧型手機」切換為關機靜音收納！', 'success');
                updateHUD();
                return;
            }
            showToast(`【${item.name}】${item.desc}`, 'info');
        }

        function focusMissionTarget(zoneId, floorNum) {
            SoundFX.click();
            if (GameState.currentFloor !== floorNum) {
                trySwitchFloor(floorNum);
                if (GameState.currentFloor !== floorNum) return;
            }
            const zones = floorNum === 1 ? ZONES_1F : ZONES_2F;
            const target = zones.find(z => z.id === zoneId);
            if (target) {
                GameState.player.targetX = target.x;
                GameState.player.targetZ = target.z;
                targetMarkerMesh.position.set(target.x, 0.05, target.z);
                targetMarkerMesh.visible = true;
                showToast(`自動導航至任務地點：【${target.name}】`, 'info');
            }
        }

        function toggleMissionSidebar() {
            const list = document.getElementById('mission-list-container');
            const icon = document.getElementById('mission-collapse-icon');
            if (list.classList.contains('hidden')) {
                list.classList.remove('hidden');
                icon.className = 'fa-solid fa-chevron-up';
            } else {
                list.classList.add('hidden');
                icon.className = 'fa-solid fa-chevron-down';
            }
        }

        function toggleMinimap() {
            const panel = document.getElementById('minimap-panel');
            panel.classList.toggle('hidden');
        }

        function showToast(msg, type = 'info') {
            const container = document.getElementById('toast-container');
            const el = document.createElement('div');
            const colors = {
                info: 'border-sky-400 bg-slate-900/95 text-sky-200',
                success: 'border-emerald-400 bg-emerald-950/95 text-emerald-200',
                warn: 'border-amber-400 bg-amber-950/95 text-amber-200',
                error: 'border-rose-500 bg-rose-950/95 text-rose-200'
            };
            el.className = `px-3.5 py-2.5 rounded-xl border text-xs font-bold shadow-xl max-w-xs transition-all duration-300 ${colors[type] || colors.info}`;
            el.innerHTML = msg;
            container.appendChild(el);
            setTimeout(() => {
                el.style.opacity = '0';
                setTimeout(() => el.remove(), 300);
            }, 3500);
        }

        // Virtual Clock Ticker
        setInterval(() => {
            if (GameState.escapedSuccess) return;
            GameState.virtualMinutes = Math.min(15 * 60 + 55, GameState.virtualMinutes + 1);
            const h = String(Math.floor(GameState.virtualMinutes / 60)).padStart(2, '0');
            const m = String(GameState.virtualMinutes % 60).padStart(2, '0');
            document.getElementById('virtual-clock').textContent = `${h}:${m} (16:00前完成借書)`;
        }, 4000);

        // Start 3D Engine on Window Load
        window.onload = function () {
            initThreeJS();
            renderMinimapBlueprint();
            updateHUD();
            animateLoop();
        };
    </script>
</body>
